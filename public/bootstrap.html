<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initialize Official Account</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-earth">
  <div class="bg-cover"></div>
  <div class="site-header"><div class="container nav"><span class="brand">EarthLink</span><span class="spacer"></span><a href="/">Home</a></div></div>
  <div class="container"><div class="card">
    <h2>Initialize Official Account</h2>
    <p>This is available only before the first official is created.</p>
    <form id="form">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Create Official</button>
      <div class="msg" id="msg"></div>
      <div class="error" id="error"></div>
    </form>
  </div></div>
  <script>
    document.getElementById('form').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const name=document.getElementById('name').value;
      const email=document.getElementById('email').value;
      const password=document.getElementById('password').value;
      const r=await fetch('/api/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
      const data=await r.json();
      if(!r.ok){document.getElementById('error').textContent=data.error||'Failed';return}
      document.getElementById('msg').textContent='Official created. You can now login.';
    });
  </script>
</body>
</html>
